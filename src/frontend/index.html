<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- I keep the viewport meta tag here so the dashboard scales properly on
         laptops, tablets, and phones instead of using a desktop-only width. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Operational dashboard for live fraud scoring, model readiness, and transaction monitoring."
    />
    <title>Fraud Detection Command Dashboard</title>
  </head>
  <body>
    <!-- I keep one root div here because React mounts the whole frontend app
         into this single element from src/main.jsx. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
